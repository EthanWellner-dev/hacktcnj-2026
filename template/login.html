{% extends 'base.html' %}
{% block title %}Login &mdash; Social Sandbox{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6 glass">
    <h1 class="text-2xl font-semibold text-slate-100 mb-4">Social Sandbox</h1>
    <p class="text-sm text-slate-400 mb-4">Secure training for your social muscles &mdash; Login</p>

    <form id="login-form" class="space-y-3">
      <input id="username" placeholder="Username" class="w-full p-3 rounded-lg" required>
      <input id="password" type="password" placeholder="Password" class="w-full p-3 rounded-lg" required>
      <div class="flex items-center justify-between">
        <button type="submit" class="btn-neon px-4 py-2 rounded-xl">Log in</button>
        <a href="/register" class="text-sm text-slate-400 underline">Create account</a>
      </div>
    </form>

    <div id="status" class="mt-3 text-sm"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
