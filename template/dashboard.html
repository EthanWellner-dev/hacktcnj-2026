<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Sandbox — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--cyan:#06b6d4;--cyan-500:#06b6d4;--cyan-400:#22d3ee;--emerald-400:#34d399;--rose-500:#fb7185}
    body{background:#020617;color:rgba(255,255,255,0.95);font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    .glass {background: rgba(15,23,42,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.06); border-radius:1rem}
    .btn-neon { background: linear-gradient(90deg, rgba(6,182,212,0.12), rgba(6,182,212,0.08)); border:1px solid rgba(6,182,212,0.18); color: #e6feff }
    .glow { box-shadow: 0 6px 30px rgba(6,182,212,0.12), 0 0 8px rgba(6,182,212,0.08) }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace }
    .xp-track{background:linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02)); border-radius:999px}
    .xp-fill{background:linear-gradient(90deg,var(--cyan-500), #7ce7f2); height:10px; border-radius:999px; box-shadow: 0 6px 20px rgba(34,211,238,0.12)}
  </style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl glass p-6 md:p-10 border-white/10">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-semibold">Social Sandbox</h1>
          <p class="text-slate-400 text-sm mt-1">High-Tech Privacy · Secret Training Facility</p>
        </div>
        <div class="text-right">
          <div class="text-sm text-slate-400">Cluster:</div>
          <div class="mono text-sm text-cyan-300">init</div>
        </div>
      </header>

      <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Left: controls are here in the JS-managed dashboard -->
        <section class="p-4 bg-slate-900/50 rounded-xl">
          <h3 class="text-sm text-slate-400">Leaderboard</h3>
          <ul id="leaderboard-list" class="mt-3 space-y-2 text-slate-200"></ul>

          <div class="mt-6">
            <div class="flex items-center justify-between mb-2">
              <div class="text-sm text-slate-400">XP Meter</div>
              <div id="xp-value" class="text-sm text-emerald-300 mono">0 XP</div>
            </div>
            <div class="xp-track h-3 w-full rounded-full">
              <div id="xp-fill" class="xp-fill" style="width:0%"></div>
            </div>
          </div>

          <div class="mt-6 border-t border-white/5 pt-4">
            <div class="text-sm text-slate-400 mb-2">Quick Actions</div>
            <div class="flex gap-2">
              <button id="btn-digital" class="btn-neon px-3 py-2 rounded-xl">Digital Comm</button>
              <button id="btn-vocal" class="btn-neon px-3 py-2 rounded-xl">Vocal Sandbox</button>
              <button id="btn-facial" class="btn-neon px-3 py-2 rounded-xl">Facial Gym</button>
              <button id="logout" class="ml-auto bg-rose-500 text-white px-3 py-2 rounded-xl">Logout</button>
            </div>
          </div>
        </section>

        <!-- Right column: main UI area / gym placeholders -->
        <section class="p-4 bg-slate-900/40 rounded-xl">
          <div id="gym-area">
            <h4 class="text-slate-100 font-medium">Welcome to the Lounge</h4>
            <p class="text-slate-400 text-sm">Select a gym to begin training.</p>
          </div>
        </section>
      </main>

    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
