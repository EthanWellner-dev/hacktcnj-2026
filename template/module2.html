{% extends 'base.html' %}
{% block title %}The Icebreaker | Social Sandbox{% endblock %}
{% block content %}

{% include '_nav.html' %}

<main class="flex-1 w-full max-w-6xl mx-auto p-6 flex flex-col gap-6 relative z-10">
    
    <!-- Module Header -->
    <div class="glass-panel rounded-xl p-6">
        <div class="inline-block bg-cyan-900/50 text-cyan-300 px-3 py-1 rounded-full text-xs font-mono border border-cyan-500/30 mb-3">
            MODULE 2: THE ICEBREAKER
        </div>
        <h2 class="text-2xl font-bold mb-2 text-white">Establish Rapport</h2>
        <p id="scenario-text" class="text-slate-400 text-sm"></p>
    </div>

    <!-- Chat Container -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- LEFT: Chat Messages -->
        <div class="lg:col-span-2 glass-panel rounded-xl p-6 flex flex-col">
            <h3 id="chat-name" class="text-sm font-mono text-slate-400 mb-4 uppercase tracking-wider">Alex (Tech Conf)</h3>
            <div id="messages-container" class="space-y-3 flex-1 overflow-y-auto mb-4">
                <!-- Messages will be rendered here -->
            </div>
            
            <!-- Input -->
            <form onsubmit="sendMessage(event)" class="flex items-center gap-2">
                <input type="text" id="message-input" placeholder="Type your message..." class="flex-1 bg-slate-900 border border-slate-700 rounded-full px-5 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
                <button type="submit" class="w-10 h-10 rounded-full bg-cyan-600 text-white flex items-center justify-center hover:bg-cyan-500 transition-all">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>

        <!-- RIGHT: Analysis -->
        <div class="glass-panel rounded-xl p-6 flex flex-col">
            <h3 class="text-sm font-mono text-slate-400 mb-4 uppercase tracking-wider"><i class="fa-solid fa-robot text-cyan-400 mr-2"></i>Analysis</h3>
            <div id="feedback-container" class="flex-1 flex flex-col justify-center text-slate-300">
                <p class="text-sm text-slate-500 text-center">Send a message to begin...</p>
            </div>
        </div>
    </div>

</main>

<style>
    .glass-panel {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    #messages-container::-webkit-scrollbar { width: 6px; }
    #messages-container::-webkit-scrollbar-track { background: transparent; }
    #messages-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    #messages-container::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>

<script>
    let conversationHistory = [];
    let isProcessing = false;
    let currentScenario = '';

    // Extract name and context from scenario text
    function extractNameAndContext(scenario) {
        // Look for capitalized words that could be names
        const nameMatches = scenario.match(/\b([A-Z][a-z]{2,})\b/g);
        let name = 'Contact';
        let context = 'Networking';
        
        if (nameMatches && nameMatches.length > 0) {
            // Filter out common words
            for (let match of nameMatches) {
                if (!['You', 'The', 'They', 'Send', 'Reach', 'Follow', 'Offer', 'Connect', 'This', 'Their'].includes(match)) {
                    name = match;
                    break;
                }
            }
        }
        
        // Try to extract location/context
        const locationMatch = scenario.match(/at a\s+([^.]+?)(?:\.|,)/);
        if (locationMatch) {
            context = locationMatch[1].toLowerCase();
            // Capitalize first letter
            context = context.charAt(0).toUpperCase() + context.slice(1);
        }
        
        return { name, context };
    }

    // List of varied icebreaker scenarios
    const scenarios = [
        "You just met Alex at a tech conference. Alex works at a cool startup and mentioned they're building AI tools. Send them a text to establish a connection and mention something you both discussed.",
        "You connected with Jordan at a networking event. Jordan is a UX designer who talked about making apps more accessible. Reach out and find a common interest.",
        "Casey gave you their card at a marketing conference. They work for a gaming company. Send a warm follow-up text and mention something you have in common.",
        "You met Morgan at a startup pitch event. They were presenting a social media tool. Follow up with them about their project.",
        "Sam works in web development and you met them at a tech meetup. They seemed interested in open-source projects. Send them a friendly message.",
        "You networked with Riley at a design workshop. They specialize in creating games for younger audiences. Reach out and find common ground.",
        "Taylor is a software engineer you met at a hackathon. You both worked on similar problems. Send a message to stay connected.",
        "You met Blake at a business conference. Blake runs a small tech company and mentioned they love mentoring. Initiate contact.",
        "Jamie is a product manager you met at a virtual networking event. They talked about making products more user-friendly. Send them a thoughtful message.",
        "You connected with Alex at a panel discussion about careers in tech. Alex gave interesting insights. Follow up on what they shared.",
        "Sky is a developer you met at a coding bootcamp meetup. You both struggled with the same programming concept. Reach out with camaraderie.",
        "You networked with Sage at a digital marketing event. They talked about content creation strategies. Send a warm follow-up.",
        "Kai gave you their card at a robotics competition. They work on automation projects. Send an enthusiastic message about their work.",
        "You met Drew at a web development conference. Drew specializes in accessibility features. Connect with them about making tech inclusive.",
        "River is a graphic designer you met at a creative professionals event. You both love visual storytelling. Send them a message.",
        "You connected with Quinn at a social entrepreneurship event. Quinn is passionate about using tech for good. Reach out enthusiastically.",
        "Ash works in cybersecurity and you met them at a tech talk. You're both interested in protecting online privacy. Send a friendly message.",
        "You networked with Casey at a coding workshop. Casey is learning the same programming language as you. Offer to stay in touch for mutual learning.",
        "Bailey is a data analyst you met at a conference. They gave a talk about making data accessible. Send a thoughtful follow-up.",
        "You met Rowan at a startup networking event. Rowan is building an app to help students with organization. Connect with them about their vision."
    ];

    async function init() {
        try {
            // Select random scenario
            currentScenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            document.getElementById('scenario-text').textContent = currentScenario;
            
            // Extract name and context from scenario and update header
            const { name, context } = extractNameAndContext(currentScenario);
            document.getElementById('chat-name').textContent = `${name} (${context})`;
            
            await backend.fetchMe();
        } catch (err) {
            console.error('Init error:', err);
        }
    }

    function renderMessages() {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        
        conversationHistory.forEach(msg => {
            const bubble = document.createElement('div');
            bubble.className = 'p-4 rounded-lg';
            
            if (msg.sender === 'user') {
                bubble.className += ' bg-gradient-to-br from-cyan-600 to-blue-600 text-white ml-8';
            } else {
                bubble.className += ' bg-slate-800/60 border border-white/10';
            }
            
            bubble.textContent = msg.text;
            container.appendChild(bubble);
        });
        
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
        e.preventDefault();
        if (isProcessing) return;
        
        const input = document.getElementById('message-input');
        const userMsg = input.value.trim();
        if (!userMsg) return;
        
        // Add to history
        conversationHistory.push({ sender: 'user', text: userMsg });
        input.value = '';
        renderMessages();
        
        isProcessing = true;
        document.getElementById('feedback-container').innerHTML = '<p class="text-sm text-yellow-400 animate-pulse">Evaluating...</p>';
        
        try {
            const token = localStorage.getItem('ss_token');
            const response = await fetch('/api/chat/evaluate', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    module: 'icebreaker',
                    user_message: userMsg,
                    context: conversationHistory.map(m => `${m.sender}: ${m.text}`).join('\n'),
                    scenario: currentScenario
                })
            });
            
            const data = await response.json();
            
            if (data.status === 'success') {
                // Show AI response
                if (data.ai_response) {
                    conversationHistory.push({ sender: 'ai', text: data.ai_response });
                    renderMessages();
                }
                
                // Show feedback
                const feedback = document.getElementById('feedback-container');
                feedback.innerHTML = `
                    <div class="space-y-3">
                        <div class="${data.passed ? 'text-emerald-400' : 'text-rose-400'} font-bold text-lg">
                            ${data.passed ? '✓ Passed' : '✗ Needs Work'}
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 mb-1">Score</div>
                            <div class="text-2xl font-bold ${data.passed ? 'text-emerald-400' : 'text-rose-400'}">${data.score}%</div>
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 mb-1">XP</div>
                            <div class="text-xl font-bold text-cyan-400">+${data.xp}</div>
                        </div>
                        <div class="bg-slate-900/50 p-3 rounded text-xs text-slate-300 border border-white/5">
                            ${data.feedback}
                        </div>
                    </div>
                `;
                
                // Update XP display
                document.getElementById('user-xp').textContent = data.xp_current;
            } else {
                document.getElementById('feedback-container').innerHTML = `<p class="text-rose-400 text-sm">${data.message}</p>`;
            }
        } catch (err) {
            console.error('Error:', err);
            document.getElementById('feedback-container').innerHTML = `<p class="text-rose-400 text-sm">Error: ${err.message}</p>`;
        }
        
        isProcessing = false;
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
<script src="/static/js/backend.js"></script>

{% endblock %}
