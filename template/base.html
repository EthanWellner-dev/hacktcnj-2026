<!doctype html>
<html lang="en">
<head>
  <!--
    Base template for Social Sandbox pages
    Provides shared head elements, fonts, Tailwind import, and custom CSS link.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Social Sandbox{% endblock %}</title>

  <!-- tailwind and fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">

  {% block head_extra %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 font-inter min-h-screen">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
