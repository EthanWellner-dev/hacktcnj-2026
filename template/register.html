{% extends 'base.html' %}
{% block title %}Register &mdash; Social Sandbox{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6 glass">
    <h1 class="text-2xl font-semibold text-slate-100 mb-4">Create Account</h1>
    <form id="register-form" class="space-y-3">
      <input id="username" placeholder="Username" class="w-full p-3 rounded-lg" required>
      <input id="password" type="password" placeholder="Password" class="w-full p-3 rounded-lg" required>
      <select id="persona" class="w-full p-3 rounded-lg" required>
        <option value="" disabled selected>Select personality</option>
        <option value="job_seeker">Job Seeker</option>
        <option value="awkward_texter">Awkward Texter</option>
        <option value="conflict_avoider">Conflict Avoider</option>
      </select>
      <div class="flex items-center justify-between">
        <button type="submit" class="btn-neon px-4 py-2 rounded-xl">Sign up</button>
        <a href="/" class="text-sm text-slate-400 underline">Back to login</a>
      </div>
    </form>
    <div id="status" class="mt-3 text-sm"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
