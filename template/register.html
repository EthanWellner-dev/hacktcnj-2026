<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Sandbox — Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#020617;color:#e6eef2;font-family:Inter,system-ui,Segoe UI,Roboto">
  <div class="w-full max-w-md p-6 bg-slate-900/60 backdrop-blur-md rounded-xl border border-white/5">
    <h1 class="text-2xl font-semibold text-slate-100 mb-4">Create Account</h1>
    <form id="register-form" class="space-y-3">
      <input id="username" placeholder="Username" class="w-full p-3 bg-transparent border border-white/10 rounded-lg text-slate-100" required>
      <input id="password" type="password" placeholder="Password" class="w-full p-3 bg-transparent border border-white/10 rounded-lg text-slate-100" required>
      <select id="persona" class="w-full p-3 bg-transparent border border-white/10 rounded-lg text-slate-100" required>
        <option value="" disabled selected>Select persona</option>
        <option value="trainer">Trainer</option>
        <option value="student">Student</option>
      </select>
      <div class="flex items-center justify-between">
        <button type="submit" class="bg-emerald-500 text-white px-4 py-2 rounded-xl">Sign up</button>
        <a href="/" class="text-sm text-slate-400 underline">Back to login</a>
      </div>
    </form>
    <div id="status" class="mt-3 text-sm"></div>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
